name: Build Tranquil PDS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-tranquil-pds.yaml
      - .github/workflows/call-docker-build.yaml

permissions:
  contents: read
  packages: write
  attestations: write
  artifact-metadata: write
  id-token: write

jobs:
  build:
    uses: ./.github/workflows/call-docker-build.yaml
    with:
      image: tranquil-pds
      # Paths are relative to this repository and the build context is the upstream clone in source/, so
      # source/Dockerfile is upstream's own Dockerfile (a repo-owned one would be e.g. tranquil/...).
      # Its DISTROLESS_IMAGE default is a multi-arch index since v0.7.0; were it single-arch again,
      # call-docker-build's strict build checks fail on InvalidBaseImagePlatform.
      dockerfiles: '["source/Dockerfile"]'
      source-repository: https://tangled.org/tranquil.farm/tranquil-pds.git
      # renovate: datasource=git-tags depName=tranquil-pds packageName=https://tangled.org/tranquil.farm/tranquil-pds versioning=semver
      source-ref: v0.8.0
      # The image ships the compiled server and frontend assets, which upstream licenses
      # under AGPLv3-or-later; the CC-BY-SA docs are not part of it.
      labels: |
        org.opencontainers.image.title=Tranquil PDS
        org.opencontainers.image.description=A Personal Data Server for the AT Protocol.
        org.opencontainers.image.licenses=AGPL-3.0-or-later
